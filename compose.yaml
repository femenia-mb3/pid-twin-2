name: ${APP_NAME:-gemelotur-demo}

services:
  app:
    image: ${APP_NAME:-gemelotur-demo}:latest
    container_name: ${APP_NAME:-gemelotur-demo}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
